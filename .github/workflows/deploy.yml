name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Create environment file from secret
        run: |
          echo "export const environment = { tmdbApiKey: '${TMDB_API_KEY}' };" > src/environments/environment.ts
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - run: npx ng build --configuration production --base-href /Movie-app-master/

      - name: Add SPA fallback
        run: cp dist/movie-app/browser/index.html dist/movie-app/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/movie-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
